; ====================================================================
;  motor_brain — ESP32 WROOM-32 (30 pin)
;  CNC Back Gauge motor kontroler
;
;  Pinout:
;    GPIO18 = PUL-  (RMT hardverski izlaz)
;    GPIO19 = DIR-
;    GPIO21 = ENA-  (INPUT_PULLUP, P108=0001 → drajver ignoriše)
;    GPIO22 = HOME senzor (INPUT_PULLUP, LOW = aktiviran)
;
;  Komunikacija: ESP-NOW (WiFi, ne treba AP/STA veza)
;  Prijevod pozicije: 640 koraka/mm (3200spr / 5mm navoj)
; ====================================================================

[env:motor_brain]
platform   = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board      = esp32dev
framework  = arduino

monitor_speed = 115200
; !! PROMIJENI upload_port i monitor_port na tvoj COM port !!
upload_port   = COM3
monitor_port  = COM3

monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -I src

lib_deps =
    ; StepperRMT je u lib/ folderu, PlatformIO ga nalaze automatski
    bblanchon/ArduinoJson@^7.0.0
